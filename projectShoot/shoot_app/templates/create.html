{% load static %}
<!DOCTYPE html>
<html lang="tk">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Goşmak - Harby talyplaryň sanawy</title>
    <link rel="stylesheet" href="{% static 'w3.css' %}">
    <style>
        body {
            background: radial-gradient(circle at 50% 10%, #0f1f17 0%, #070d0a 100%) !important;
            color: #e2e8f0 !important;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            margin: 0;
            padding-bottom: 50px;
        }

        /* Ýokarky Yza düwmäniň stili */
        .top-nav {
            max-width: 700px;
            margin: 40px auto 10px auto;
            padding: 0 15px;
        }

        .btn-taktik-back {
            background-color: #1b2e22 !important;
            color: #34d399 !important;
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 10px 24px;
            border-radius: 12px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s ease;
        }

        .btn-taktik-back:hover {
            background-color: #059669 !important;
            color: #ffffff !important;
            box-shadow: 0 0 12px rgba(5, 150, 105, 0.5);
        }

        /* Taktiki Form Kartasy */
        .taktik-form-card {
            background: linear-gradient(145deg, #121c16, #0d1511) !important;
            color: #e2e8f0 !important;
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.7);
            padding: 30px;
            margin: 0 auto;
            width: 100%;
            max-width: 700px;
        }

        .form-title {
            color: #34d399 !important;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 0 15px rgba(16, 185, 129, 0.4);
            margin-bottom: 25px;
        }

        /* Inputlar we Select */
        .taktik-input, .taktik-select {
            background-color: #1b2e22 !important;
            color: #ffffff !important;
            border: 1px solid #2d4a37 !important;
            border-radius: 12px !important;
            padding: 12px 15px !important;
            outline: none;
            transition: all 0.2s;
        }

        .taktik-input:focus, .taktik-select:focus {
            border-color: #10b981 !important;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }

        .taktik-select option {
            background-color: #121c16;
            color: #ffffff;
        }

        /* Goşmak Düwmäni */
        .btn-cyber-green {
            background: linear-gradient(135deg, #059669, #10b981) !important;
            color: #ffffff !important;
            border: none;
            padding: 12px 35px;
            border-radius: 12px;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-cyber-green:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.7);
        }
    </style>
</head>

<body>

    <!-- Yza Düwmäni üçin ýer -->
    <div class="top-nav">
        <a href="{% url 'home' %}" class="btn-taktik-back">← Yza gitmek</a>
    </div>

    <!-- Esasy Forma Kartasy -->
    <div style="padding: 0 15px;">
        <form method="POST" class="taktik-form-card" align="center">
            {% csrf_token %}
            
            <h2 class="form-title">Talyph goşmak</h2>
            
            <div align="center">
                <!-- Ady -->
                <div class="w3-row w3-section">
                    <div class="w3-rest">
                        <input class="w3-input taktik-input" style="width: 100%; max-width: 450px;" name="at" type="text" placeholder="Ulanyjynyň ady" required>
                    </div>
                </div>
                
                <!-- Familiýasy -->
                <div class="w3-row w3-section">
                    <div class="w3-rest">
                        <input class="w3-input taktik-input" style="width: 100%; max-width: 450px;" name="fam" type="text" placeholder="Familiýasy" required>
                    </div>
                </div>

                <!-- Topary saýlamak -->
                <div class="w3-row w3-section">
                    <div class="w3-rest">
                        <select class="w3-select taktik-select" style="width: 100%; max-width: 450px;" name="topar" required>
                            <option value="" disabled selected>Topary saýlamak</option>
                            <option value="121">121-nji topar</option>
                            <option value="122">122-nji topar</option>
                            <option value="221">221-nji topar</option>
                            <option value="222">222-nji topar</option>
                            <option value="131">131-nji topar</option>
                            <option value="132">132-nji topar</option>
                            <option value="231">231-nji topar</option>
                            <option value="232">232-nji topar</option>
                            <option value="141">141-nji topar</option>
                            <option value="142">142-nji topar</option>
                            <option value="241">241-nji topar</option>
                            <option value="242">242-nji topar</option>
                            <option value="151">151-nji topar</option>
                            <option value="152">152-nji topar</option>
                            <option value="251">251-nji topar</option>
                            <option value="252">252-nji topar</option>
                        </select>
                    </div>
                </div>
                
                <!-- PM 1-nji atyş (1-i) -->
                <div class="w3-row w3-section">
                    <div class="w3-rest">
                        <input class="w3-input taktik-input" style="width: 100%; max-width: 450px;" name="pm1_1" type="number" placeholder="PM 1-nji atyş (1-nji synanşyk)">
                    </div>
                </div>
                
                <!-- PM 1-nji atyş (2-si) -->
                <div class="w3-row w3-section">
                    <div class="w3-rest">
                        <input class="w3-input taktik-input" style="width: 100%; max-width: 450px;" name="pm1_2" type="number" placeholder="PM 1-nji atyş (2-nji synanşyk)">
                    </div>
                </div>
                
                <!-- PM 2-nji atyş (1-i) -->
                <div class="w3-row w3-section">
                    <div class="w3-rest">
                        <input class="w3-input taktik-input" style="width: 100%; max-width: 450px;" name="pm2_1" type="number" placeholder="PM 2-nji atyş (1-nji synanşyk)">
                    </div>
                </div>
                
                <!-- PM 2-nji atyş (2-si) -->
                <div class="w3-row w3-section">
                    <div class="w3-rest">
                        <input class="w3-input taktik-input" style="width: 100%; max-width: 450px;" name="pm2_2" type="number" placeholder="PM 2-nji atyş (2-nji synanşyk)">
                    </div>
                </div>
                
                <!-- AK-74 -->
                <div class="w3-row w3-section">
                    <div class="w3-rest">
                        <input class="w3-input taktik-input" style="width: 100%; max-width: 450px;" name="ak74" type="number" placeholder="AK-74 atyş netijesi">
                    </div>
                </div>
            </div>
            
            <!-- Submit Düwme (Superuser baradaky barlag saklandy) -->
            <p class="w3-center" style="margin-top: 30px;">
                {% if user.is_superuser %}
                <button type="submit" class="btn-cyber-green">Maglumaty Goşmak</button>
                {% endif %}
            </p>
        </form>
    </div>

</body>

</html>
